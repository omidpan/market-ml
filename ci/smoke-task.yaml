platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.11-slim"

inputs:
  - name: market-ml
  - name: market-data

# Leaving these blank tells Concourse to pull them dynamically 
# from your local shell environment variables at runtime.
params:
  DATA_PATH:
  CONFIG_PATH:
  REPORTS_PATH:
  PYTHON:

run:
  path: market-ml/scripts/market_pipeline_run.sh
  args: ["intc", "--stage", "validate"]