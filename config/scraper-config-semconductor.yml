platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.11-slim"

inputs:
  - name: market-ml-project
  - name: market-data

params:
  # Change these to match your absolute local paths from your .env file
  DATA_PATH: market_ml/data
  CONFIG_PATH: market_ml/config
  REPORTS_PATH: market_ml/reports
  PYTHON: python

run:
  path: market-ml-project/scripts/market_pipeline_run.sh
  args: ["AMAT", "--stage", "validate"]